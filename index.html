<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>财务中心运营后台原型 - 按菜单结构版</title>
  <link rel="stylesheet" href="assets/finance-style.css?v=20260610-v7-fund-impact" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>财务中心运营后台</h1>
      <p>按「一级菜单 / 二级页面」精确拆分<br>核心：资金出入、记账、流水、对账、审计全链路清晰</p>
    </div>
    <div class="menu-wrap" id="menu"></div>
  </aside>
  <section class="content">
    <header class="topbar">
      <div class="crumb">
        <div class="path" id="breadcrumb">财务总览 / 资金看板</div>
        <h2 id="pageTitle">资金看板</h2>
      </div>
      <div class="top-actions">
        <div class="search"><span>⌕</span><input placeholder="搜索流水号 / 账户 / 批次 / 模板" /></div>
        <span class="badge">菜单结构 <strong>10 一级 / 21 二级</strong></span>
        <button class="btn help-btn" onclick="openFeatureHelp()">模块功能说明</button>
        <button class="btn primary" onclick="openTrace('CASH202605280001')">链路追踪</button>
      </div>
    </header>
    <main class="main" id="main"></main>
  </section>
</div>

<div class="drawer-mask" id="drawerMask" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <h3 id="drawerTitle">资金链路追踪</h3>
    <button class="close" onclick="closeDrawer()">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="feature-mask" id="featureHelpMask" onclick="closeFeatureHelp(event)">
  <section class="feature-modal" id="featureHelpModal" onclick="event.stopPropagation()">
    <div class="feature-header">
      <div>
        <h3 id="featureHelpTitle">模块功能说明</h3>
        <p id="featureHelpModule">财务中心</p>
      </div>
      <button class="close" onclick="closeFeatureHelp()">×</button>
    </div>
    <div class="feature-body" id="featureHelpBody"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="assets/finance-config.js?v=20260610-v7-fund-impact"></script>
<script src="assets/finance-data.js?v=20260610-v7-fund-impact"></script>
<script src="assets/finance-ledger-flows.js?v=20260610-v7-fund-impact"></script>
<script src="assets/finance-template-helpers.js?v=20260610-v7-fund-impact"></script>
<script src="assets/finance-accounting-excel-data.js?v=20260610-v7-fund-impact"></script>
<script src="assets/finance-accounting-excel-helpers.js?v=20260610-v7-fund-impact"></script>
<script src="assets/finance-fund-impact-matrix-data.js?v=20260610-v7-fund-impact"></script>
<script src="assets/finance-fund-impact-matrix-helpers.js?v=20260610-v7-fund-impact"></script>
<script src="assets/finance-pages.js?v=20260610-v7-fund-impact"></script>
<script src="assets/finance-core.js?v=20260610-v7-fund-impact"></script>
</body>
</html>
